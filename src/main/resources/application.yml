spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8080  # Atrás do proxy (Railway), o IP real vem do X-Forwarded-For. "native" usa o
  # RemoteIpValve do Tomcat, que só confia em proxies de rede interna.
  forward-headers-strategy: native
